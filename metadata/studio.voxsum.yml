# fdroiddata recipe for VoxSum. Copy into fdroiddata/metadata/studio.voxsum.yml when
# submitting the Merge Request. See FDROID_SUBMISSION.md for the full playbook.
Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: vieenrose
SourceCode: https://github.com/vieenrose/VoxSumDroid
IssueTracker: https://github.com/vieenrose/VoxSumDroid/issues

RepoType: git
Repo: https://github.com/vieenrose/VoxSumDroid.git

Builds:
  - versionName: "0.1.0"
    versionCode: 1
    commit: v0.1.0
    submodules: true          # native/llama.cpp, native/audiocpp, native/crispasr, native/crispasr-ggml
    ndk: r27c                 # == 27.2.12479018 (matches app/build.gradle.kts ndkVersion)
    # Everything native compiles from the pinned submodules inside the gradle/NDK build.
    gradle:
      - yes

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: "0.1.0"
CurrentVersionCode: 1

# AntiFeatures for the GitHub/self-hosted build: the in-app updater uses REQUEST_INSTALL_PACKAGES
# to download + install the signed APK (this is the "UpstreamNonFree"/self-update behaviour F-Droid
# flags). For an official f-droid.org (Route A) submission, the updater must be removed via a
# dedicated `fdroid` product flavor (not yet implemented) — the F-Droid client provides updates
# there, so the in-app updater is redundant. Models are FOSS (Apache-2.0 / MIT), SHA-256-pinned, and
# downloaded at first run from upstream release pages (or side-loaded). If the optional
# podcast/YouTube flavor is added later, declare NonFreeNet on that flavor.
