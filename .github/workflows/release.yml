name: Build & release APK

# Two modes:
#  - workflow_dispatch: dry run — builds the app and uploads the APK as an artifact.
#  - push tag v*: builds a SIGNED APK and attaches it to a GitHub Release (needs secrets
#    KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD). See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # LiteRT-only native build (no more ORT-from-source)
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      # Native code builds from submodules: native/llama.cpp (summarizer) and native/audiocpp,
      # native/crispasr, native/crispasr-ggml (ASR + diarization). NOT recursive: audio.cpp carries
      # a nested submodule with an SSH URL a runner cannot fetch, and CrispASR's own nested ggml is
      # replaced by the top-level native/crispasr-ggml pin (see app/src/main/cpp/CMakeLists.txt).
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false        # we install our own NDK/cmake below
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No android-actions/setup-android: on the 2026-09 runner images its sdkmanager call fails on
      # PREVIEW licences it cannot answer. The image already ships the SDK at $ANDROID_HOME; `yes |`
      # answers every licence prompt.
      - name: Install NDK + cmake + platform
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      # Gate the release on the host test suite. v0.36.0 shipped with an instrumented suite that
      # did not even COMPILE (it still referenced the LiteRT engine deleted in the migration),
      # because this workflow only ever built the APK. Unit tests are seconds; the release APK is
      # minutes — failing here is far cheaper than shipping.
      #
      # Host (JVM) tests only. The instrumented suite needs a device and multi-hundred-MB models,
      # so it stays a manual on-device step (see TextGenTest / SummarizerQualityTest).
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Signed release when a keystore is configured; otherwise a debug APK so the dry run
      # still validates the native build end to end.
      - name: Build APK
        env:
          VOXSUM_KEYSTORE: ${{ runner.temp }}/release.keystore
          VOXSUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOXSUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOXSUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact (always — proves the build works)
        uses: actions/upload-artifact@v4
        with:
          name: voxsum-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish signed APK as a GitHub Release
        if: ${{ github.ref_type == 'tag' && env.HAS_KEYSTORE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "voxsum-${GITHUB_REF_NAME}.apk"
          NOTES="Offline on-device transcription + diarization + summarization. Download and install the APK."
          gh release create "$GITHUB_REF_NAME" "voxsum-${GITHUB_REF_NAME}.apk" \
            --title "VoxSum $GITHUB_REF_NAME" --notes "$NOTES" \
          || gh release upload "$GITHUB_REF_NAME" "voxsum-${GITHUB_REF_NAME}.apk" --clobber
